name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[stylize]" pytest ruff pyright build
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: pyright src/colophon/stylize/providers tests
      - name: Test
        run: pytest
      - name: Build package
        run: python -m build
